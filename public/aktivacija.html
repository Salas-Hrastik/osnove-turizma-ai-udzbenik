<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aktivacija pristupa | Osnove turizma i ugostiteljstva</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f7f7;color:#173b46;font-family:system-ui,sans-serif}.card{width:min(560px,100%);padding:32px 28px;border:1px solid #c9dada;border-radius:20px;background:#fff;box-shadow:0 20px 55px rgba(13,58,67,.12)}.eyebrow{margin:0;color:#a56b00;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:clamp(28px,6vw,40px);line-height:1.1}.lead{margin:0 0 22px;line-height:1.55;color:#506970}.error{display:none;padding:11px 13px;border-radius:10px;background:#fff0ee;color:#9b2c20;font-weight:700}form,label{display:grid;gap:6px}form{gap:15px}label{font-weight:750}input{min-height:46px;padding:10px 12px;border:1px solid #aec5c8;border-radius:10px;font:inherit}input[name=token]{text-transform:uppercase}button{min-height:48px;border:0;border-radius:999px;background:#0b5968;color:#fff;font:inherit;font-weight:850;cursor:pointer}.note{margin:20px 0 0;font-size:13px;line-height:1.5;color:#60777d}.note a{color:#0b5968;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">AIEduka · siguran pristup</p>
    <h1>Aktivacija pristupa</h1>
    <p class="lead">Osnove turizma i ugostiteljstva — AI udžbenik. Unesite adresu e-pošte korištenu pri kupnji i pristupni kod koji ste primili nakon potvrđenog plaćanja.</p>
    <p id="error" class="error" role="alert"></p>
    <form action="/api/aieduka-activate" method="post">
      <input id="next" type="hidden" name="next" value="/" />
      <label>E-pošta<input type="email" name="email" required autocomplete="email" /></label>
      <label>Pristupni kod<input name="token" required minlength="12" autocomplete="one-time-code" placeholder="AIED-XXXXXX-XXXXXX-XXXXXX" /></label>
      <button type="submit">Aktiviraj i otvori platformu</button>
    </form>
    <p class="note">Nemate pristupni kod? <a href="https://www.aieduka.hr/platforme/osnove-turizma#licenciranje">Kupite pristup na AIEduka webu</a>.</p>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const next=params.get('next');if(next&&next.startsWith('/')&&!next.startsWith('//'))document.getElementById('next').value=next;const error=params.get('greska');if(error){const el=document.getElementById('error');el.textContent=error;el.style.display='block'}
  </script>
</body>
</html>
